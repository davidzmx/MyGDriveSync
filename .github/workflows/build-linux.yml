name: Build Linux Packages (.deb & AppImage)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev curl libgl1-mesa-glx libegl1-mesa libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run unit tests
        run: |
          python -m unittest discover tests

      - name: Build Debian Package (.deb)
        run: |
          chmod +x scripts/build_deb.sh
          ./scripts/build_deb.sh

      - name: Build AppImage (Universal Linux)
        run: |
          chmod +x scripts/build_appimage.sh
          ./scripts/build_appimage.sh

      - name: Upload Debian Package (.deb)
        uses: actions/upload-artifact@v4
        with:
          name: MyGDriveSync-Linux-deb
          path: dist/mygdrivesync_0.1.0_amd64.deb
          if-no-files-found: error

      - name: Upload AppImage (Portable)
        uses: actions/upload-artifact@v4
        with:
          name: MyGDriveSync-Linux-AppImage
          path: dist/MyGDriveSync-x86_64.AppImage
          if-no-files-found: error
